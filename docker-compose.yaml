services:
    php:
        build: docker/php
        image: wobqqq/oc-php:8.4
        user: '${UID:-1000}:${GID:-1000}'
        # The parent directory is mounted so the core's Composer path repository (../nova-aegis) resolves.
        working_dir: /work/nova-aegis-ip-blocker
        volumes:
            - ..:/work
            - composer-cache:/tmp/composer

volumes:
    composer-cache:
